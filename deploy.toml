# hamsci-physics deploy manifest — declares how this client gets from repo
# source to its production location.  Conforms to the HamSCI client contract
# (sigmond/docs/CLIENT-CONTRACT.md).
#
# hamsci-physics is the science half of the 2026-08-24 hf-timestd split: it
# reads the timing core's data products under /var/lib/timestd (a frozen
# contract of the split — the data root does NOT move) and writes the
# ionospheric products and the GRAPE/PSWS daily datasets.

[package]
name             = "hamsci-physics"
version          = "0.1.0"
description      = "Ionospheric science products (TEC/dTEC, TID, GRAPE) from HF time-standard observations"
contract_version = "0.8"
license          = "MIT"

# ---------------------------------------------------------------------------
# Configuration interview (CONTRACT §14).  `smd config init|edit
# hamsci-physics` invokes these; they honour the §14.3 env bag (STATION_*)
# so a host that already configured hf-timestd answers nothing twice.
# ---------------------------------------------------------------------------

[contract.config]
init = "scripts/setup-station.sh"
edit = "scripts/config-review.sh"

# ---------------------------------------------------------------------------
# Build phase: a venv at /opt/git/sigmond/hamsci-physics/venv.
# ---------------------------------------------------------------------------

# hamsci-dsp and hs-uploader are NOT on PyPI: they are sibling checkouts,
# installed editable so a `git pull` of either propagates without a
# reinstall.  They must go in BEFORE this package, or pip resolves
# "hamsci-dsp>=0.5.0" against an index that does not have it and the build
# fails.  The interpreter is the fleet's uv-managed CPython 3.11, matching
# every other client venv (digital_rf / h5py wheels are built for it).
# ⛔ The interpreter path names the MINOR series, never the patch release.
# It used to read cpython-3.11.15; uv had already moved its managed CPython to
# 3.11.16, so the first build step pointed at a directory that no longer
# existed.  /opt/uv/python/cpython-3.11-linux-x86_64-gnu is the stable symlink
# uv maintains onto whichever patch it currently holds, so the next patch bump
# cannot silently break every fresh install again.
[build]
steps = [
    "/opt/uv/python/cpython-3.11-linux-x86_64-gnu/bin/python3.11 -m venv /opt/git/sigmond/hamsci-physics/venv",
    "/opt/git/sigmond/hamsci-physics/venv/bin/pip install --upgrade pip setuptools wheel",
    "/opt/git/sigmond/hamsci-physics/venv/bin/pip install -e /opt/git/sigmond/hamsci-dsp",
    "/opt/git/sigmond/hamsci-physics/venv/bin/pip install -e /opt/git/sigmond/hs-uploader",
    "/opt/git/sigmond/hamsci-physics/venv/bin/pip install -e .",
]
# What the steps above must leave behind.  sigmond reads this twice: its
# installer skips the build when the artefact already exists, and refuses to
# report an install whose steps exited 0 without producing it; the readiness
# gate reads it to decide whether this client counts as built.  Declaring
# nothing here is how a build that never ran could pass for one that did.
produces = ["/opt/git/sigmond/hamsci-physics/venv/bin/hamsci-physics"]

# ---------------------------------------------------------------------------
# Install phase.
# ---------------------------------------------------------------------------

[install]
# Runs as the same service user as the timing core: the science products land
# inside /var/lib/timestd, which hf-timestd owns.
user  = "timestd"
group = "timestd"

# The CLI on PATH, the way every other client in the suite exposes its own.
# sigmond's readiness probe runs `<binary> version --json` to prove the venv
# resolves end to end, and it looks on PATH first.  Without this link the probe
# reported `client binary not found` even on AC0G-B4, where the venv existed
# and GRAPE was running -- a working station failing its own gate.
[[install.steps]]
kind = "link"
src  = "venv/bin/hamsci-physics"
dst  = "/usr/local/bin/hamsci-physics"

# ⚠ The three steps below use `name`/`run`, which the client contract does not
# define -- it specifies kind = "link" | "copy" | "render" -- and sigmond
# implements only `link`.  So these have never executed.  A fresh station gets
# /etc/hamsci-physics/config.toml from `smd config init hamsci-physics`
# ([contract.config] above) and the output directories from hf-timestd, which
# owns /var/lib/timestd.  Left in place, and labelled, rather than quietly
# deleted: converting them to contract kinds (mkdir + render) is the right
# repair and belongs with the sigmond work that implements those kinds.
[[install.steps]]
name = "config directory"
run  = "install -d -m 0755 /etc/hamsci-physics"

[[install.steps]]
name = "config template"
run  = "test -f /etc/hamsci-physics/config.toml || install -m 0644 config/hamsci-physics-config.toml.template /etc/hamsci-physics/config.toml"

[[install.steps]]
name = "science output directories"
run  = "install -d -o timestd -g timestd -m 0755 /var/lib/timestd/phase2/fusion /var/lib/timestd/phase2/science"

# ---------------------------------------------------------------------------
# Units.  The `grape-daily` timer KEEPS its name across the split: operators
# know it, and renaming it would break every runbook for no gain.  The
# service units take the hamsci-physics- prefix.
#
# hamsci-physics-fusion.service IS enabled.  hf-timestd's manifest carried a
# comment calling the stage "DISABLED 2026-08-10 ... produces nothing
# trustworthy", but the running system disagrees: on B4 it writes ~14
# carrier-phase dTEC records a minute plus differential dTEC for WWV/WWVH/BPM,
# reading and writing the SQLite store.  Leaving it out of this list would
# have made the cutover silently stop live science.
# ---------------------------------------------------------------------------

[systemd]
units = [
    "hamsci-physics-fusion.service",
    "grape-daily.timer",
    "hamsci-physics-reanalysis.timer",
    "hamsci-physics-ionex-download.timer",
    # grape-upload-retry.timer — RETIRED 2026-06-30 (single-host uploader):
    # hs-uploader.service owns GRAPE upload retries.  Unit files retained
    # (disable-not-delete), but there is no longer anything to revert TO:
    # 2026-08-26 removed the in-process upload path entirely, and the
    # `grape upload` command those units invoke now refuses and exits 2.
    # Re-enabling them cannot resurrect a second uploader; it just fails.
]

# ---------------------------------------------------------------------------
# Dependencies.
# ---------------------------------------------------------------------------

[deps]

[[deps.git]]
name = "hf-timestd"
why  = "produces the raw_buffer + L2 data products this client reads"

[[deps.system]]
name = "gfortran"
why  = "iri2020 compiles Fortran on first use (reanalysis profiles)"

[[deps.system]]
name = "build-essential"
why  = "same as gfortran — IRI/pyLAP builds"

# ---------------------------------------------------------------------------
# Single-host uploader pipeline.  MOVED VERBATIM from hf-timestd's
# deploy.toml in the split — the transport `name` and source `source_id` are
# PINNED: they are the watermark keys the running daemon uses for the grape
# cursor.  Changing them would re-scan the KEEP-retention spool and re-ship
# every already-shipped OBS* dataset.
#
# This block must exist in exactly ONE repo's deploy.toml.  It was removed
# from hf-timestd in the same commit that added it here.
# ---------------------------------------------------------------------------

# GRAPE Digital RF datasets -> PSWS (daily)
[[hs_uploader.pipeline]]
name = "grape-psws"
max_records_per_pump = 64
[hs_uploader.pipeline.source]
type = "filetree"
root = "/var/lib/timestd/upload"
patterns = ["OBS*"]
retention = "keep"
match_dirs = true
table = "grape.dataset"
source_id = "grape-datasets:/var/lib/timestd/upload"
[hs_uploader.pipeline.transport]
type = "psws_dataset"
instrument_id = "{instrument_id}"
host = "pswsnetwork.eng.ua.edu"
table = "grape.dataset"
sftp_user = "{station_id}"
name = "psws-grape-sftp:pswsnetwork.eng.ua.edu:{station_id}"
[hs_uploader.pipeline.identity]
station_id = "{station_id}"
